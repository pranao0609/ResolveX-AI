[pytest]
# ── Test discovery ─────────────────────────────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── Asyncio mode (for pytest-asyncio) ─────────────────────────────────────────
asyncio_mode = auto

# ── Output verbosity ──────────────────────────────────────────────────────────
addopts =
    --verbose
    --tb=short
    --strict-markers
    --color=yes

# ── Markers ───────────────────────────────────────────────────────────────────
markers =
    unit: Pure unit tests — no I/O, no external dependencies
    integration: Integration tests — use TestClient and in-memory SQLite
    slow: Tests that take more than 1 second (e.g. model load, I/O)
